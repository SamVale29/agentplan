name: Adapter request
description: Request support for a tool, provider or framework adapter
title: "[Adapter]: "
labels:
  - adapter
body:
  - type: input
    id: system
    attributes:
      label: System or provider
      placeholder: Example tool or provider name
    validations:
      required: true
  - type: textarea
    id: events
    attributes:
      label: Supported event shapes
      description: Link official documentation and describe the tool-call payloads that need normalization.
    validations:
      required: true
  - type: textarea
    id: actions
    attributes:
      label: Actions and permissions
      description: List the action types, resources and side effects the adapter would expose.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: I removed credentials and sensitive customer data.
          required: true
