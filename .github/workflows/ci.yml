name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - run: pnpm audit --audit-level high
      - name: AgentPlan Policy Check
        uses: ./.github/actions/agentplan-policy-check
        with:
          config: agentplan.yaml
          comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          github-token: ${{ github.token }}
      - name: Upload AgentPlan SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentplan-sarif
          path: agentplan.sarif
          if-no-files-found: ignore
